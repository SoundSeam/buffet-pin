services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buffet_pin_test
      POSTGRES_PASSWORD: buffet_pin_test
      POSTGRES_DB: buffet_pin_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buffet_pin_test -d buffet_pin_test"]
      interval: 1s
      timeout: 3s
      retries: 30
